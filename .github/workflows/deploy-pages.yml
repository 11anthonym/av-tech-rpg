name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: game3d/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: game3d/pnpm-lock.yaml
      - name: Verify legacy contracts
        run: node scripts/qa-all.js --fast
      - name: Install locked 3D dependencies
        run: pnpm --dir game3d install --frozen-lockfile
      - name: Test and build 3D client
        run: |
          pnpm --dir game3d test
          pnpm --dir game3d build
          pnpm --dir game3d build:portable
      - name: Install browser
        run: pnpm --dir game3d exec playwright install --with-deps chromium
      - name: Verify production-subpath browser flow
        run: pnpm --dir game3d test:browser --project=chromium
      - name: Stage original game and separate 3D client
        run: node scripts/build-pages.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public-3d:
    name: Verify published 3D game
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      EXPECTED_BUILD: ${{ github.sha }}
      PLAYWRIGHT_PUBLIC_SITE: ${{ needs.deploy.outputs.page_url }}
      RECORD_VIDEO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: game3d/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: game3d/pnpm-lock.yaml
      - run: pnpm bootstrap
      - run: pnpm --dir game3d exec playwright install --with-deps chromium
      - name: Exercise the actual published commit
        run: pnpm test:public
      - name: Retain public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-3d-browser-evidence
          path: |
            game3d/public-test-results/
            game3d/public-playwright-report/
