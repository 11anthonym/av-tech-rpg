name: QA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-qa:
    name: Static and unit QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run fast QA
        run: node scripts/qa-all.js --fast

  game3d:
    name: 3D production build and browser QA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game3d
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: game3d/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: game3d/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:portable
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Test staged production site at the repository subpath
        run: xvfb-run --auto-servernum pnpm test:browser
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game3d-browser-evidence
          path: |
            game3d/test-results/
            game3d/playwright-report/
      - name: Preserve combined static site
        uses: actions/upload-artifact@v4
        with:
          name: combined-pages-preview
          path: .pages/
          include-hidden-files: true
          if-no-files-found: error
