name: QA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      shop_stress:
        description: Run only three normal-input Chromium cargo replays
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fast-qa:
    if: ${{ !inputs.shop_stress }}
    name: Static and unit QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Run fast QA
        run: node scripts/qa-all.js --fast

  game3d:
    if: ${{ !inputs.shop_stress }}
    name: 3D production build and browser QA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game3d
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: game3d/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: game3d/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:portable
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Test staged production site at the repository subpath
        run: xvfb-run --auto-servernum pnpm test:browser
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game3d-browser-evidence
          path: |
            game3d/test-results/
            game3d/playwright-report/
      - name: Preserve combined static site
        uses: actions/upload-artifact@v4
        with:
          name: combined-pages-preview
          path: .pages/
          include-hidden-files: true
          if-no-files-found: error

  local-setup:
    if: ${{ !inputs.shop_stress }}
    name: Fresh local setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm bootstrap
      - run: pnpm test
      - run: pnpm build
      - run: node --test scripts/tests/local-preview.test.mjs

  shop-stress:
    if: ${{ inputs.shop_stress }}
    name: Repeated Chromium shop replay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game3d
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: game3d/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: game3d/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:portable
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum pnpm exec playwright test e2e/shop-prep.spec.ts --project=chromium --repeat-each=3
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repeated-shop-evidence
          path: |
            game3d/test-results/
            game3d/playwright-report/
